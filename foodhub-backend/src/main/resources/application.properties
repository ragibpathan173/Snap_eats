# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${SERVER_PORT:${PORT:8081}}
spring.application.name=FoodHub

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/foodhub;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.use_sql_comments=${SPRING_JPA_PROPERTIES_HIBERNATE_USE_SQL_COMMENTS:true}
spring.jpa.open-in-view=false

# ===============================
# FLYWAY MIGRATIONS
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true

# ===============================
# H2 CONSOLE (Development Only)
# ===============================
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=${SPRING_H2_CONSOLE_WEB_ALLOW_OTHERS:true}

# ===============================
# SECURITY (JWT)
# ===============================
security.jwt.secret=${SECURITY_JWT_SECRET:SnapEatsJwtSecretKeyForHmacSigningMustBeAtLeast32Chars}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:86400000}
security.otp.dev-return=${SECURITY_OTP_DEV_RETURN:true}

# OTP Delivery configuration
otp.delivery.email.enabled=${OTP_DELIVERY_EMAIL_ENABLED:false}
otp.delivery.email.from=${OTP_DELIVERY_EMAIL_FROM:no-reply@snap-eats.local}
otp.delivery.sms.enabled=${OTP_DELIVERY_SMS_ENABLED:false}
otp.delivery.sms.webhook-url=${OTP_DELIVERY_SMS_WEBHOOK_URL:}
otp.delivery.sms.auth-token=${OTP_DELIVERY_SMS_AUTH_TOKEN:}

# Optional owner-admin bootstrap. Leave blank unless a deployment needs this path.
demo.owner-admin.email=${DEMO_OWNER_ADMIN_EMAIL:}
demo.owner-admin.phone=${DEMO_OWNER_ADMIN_PHONE:}

# SMTP configuration (enable + configure to send real email OTPs)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.foodhub=${LOGGING_LEVEL_COM_FOODHUB:DEBUG}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASIC_BINDER:TRACE}
logging.pattern.level=%5p [%X{correlationId:-}]

# ===============================
# JACKSON (JSON) CONFIGURATION
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ===============================
# FILE UPLOAD (if needed)
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# ACTUATOR (Optional - for monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,diskSpace,ping
