previews:
  generation: off

services:
  - type: web
    name: snap-eats-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: BACKEND_UPSTREAM
        fromService:
          type: pserv
          name: snap-eats-backend
          property: hostport

  - type: pserv
    name: snap-eats-backend
    runtime: docker
    dockerfilePath: ./foodhub-backend/Dockerfile
    dockerContext: ./foodhub-backend
    envVars:
      - key: PORT
        value: "8081"
      - key: DATABASE_URL
        fromDatabase:
          name: snap-eats-db
          property: connectionString
      - key: SECURITY_JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "false"
      - key: SPRING_H2_CONSOLE_WEB_ALLOW_OTHERS
        value: "false"
      - key: SECURITY_OTP_DEV_RETURN
        value: "true"
      - key: OTP_DELIVERY_EMAIL_ENABLED
        value: "false"
      - key: OTP_DELIVERY_SMS_ENABLED
        value: "false"
      - key: LOGGING_LEVEL_COM_FOODHUB
        value: INFO
      - key: LOGGING_LEVEL_ORG_HIBERNATE_SQL
        value: INFO
      - key: LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASIC_BINDER
        value: WARN
      - key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        value: never

databases:
  - name: snap-eats-db
    databaseName: snap_eats
    user: snap_eats_user
    ipAllowList: []
